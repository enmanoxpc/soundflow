name: Build SoundFlow APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK with Gradle
      working-directory: SoundFlow
      run: gradle :app:assembleDebug --stacktrace

    - name: Upload SoundFlow APK
      uses: actions/upload-artifact@v4
      with:
        name: SoundFlow-Debug-APK
        path: SoundFlow/app/build/outputs/apk/debug/*.apk
        retention-days: 14
